# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
config:
  validation: true
  warningsAsErrors: false

complexity:
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  LongMethod:
    # Compose screens are declarative trees; length is not a good complexity signal there.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 25
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    ignorePrivate: true
    ignoreOverridden: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview', 'ThemePreviews', 'FontScalePreviews', 'ScreenPreviews']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
  UnusedPrivateMember:
    # Previews are private and only used by the IDE and screenshot tests.
    ignoreAnnotated: ['Preview', 'ThemePreviews', 'FontScalePreviews', 'ScreenPreviews']
