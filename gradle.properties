# Gradle daemon and build performance
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
# Compose Preview Screenshot Testing (experimental AGP feature, see shelf.android.screenshot).
android.experimental.enableScreenshotTest=true
# Resource values are only needed where a module opts in explicitly.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
