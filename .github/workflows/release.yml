name: Release

# Builds a signed Android App Bundle when a version tag (v1.2.3) is pushed.
#
# Repository secrets:
#   SHELF_KEYSTORE_BASE64    the upload keystore, base64-encoded (base64 -w0 release.jks)
#   SHELF_KEYSTORE_PASSWORD  keystore password
#   SHELF_KEY_ALIAS          key alias
#   SHELF_KEY_PASSWORD       key password
#   GOOGLE_SERVICES_JSON     optional: contents of google-services.json, to ship with sync enabled
#
# No keystore or Firebase file is ever committed; both only exist on the runner during the job.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SHELF_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SHELF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Add the Firebase configuration (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: building with sync disabled."
          fi

      - name: Check
        run: ./gradlew spotlessCheck detekt lint test

      - name: Build the signed bundle
        env:
          SHELF_KEYSTORE_PASSWORD: ${{ secrets.SHELF_KEYSTORE_PASSWORD }}
          SHELF_KEY_ALIAS: ${{ secrets.SHELF_KEY_ALIAS }}
          SHELF_KEY_PASSWORD: ${{ secrets.SHELF_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Verify the signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload the bundle and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: shelf-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/bundle/release/app-release.aab \
            --title "Shelf $GITHUB_REF_NAME" --generate-notes

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
